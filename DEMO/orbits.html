<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DE200 Barycentric Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>DE200 Barycentric Demo</h1>
      <p>
        Interactive visualisation of barycentric positions derived from the
        JPL DE200 ephemeris constants. The integration is Newtonian and
        intended for qualitative exploration only.
      </p>


    </header>
    <section class="controls">
      <div class="control-group">
        <label for="time-slider">Epoch</label>
        <div class="playback-controls">
          <button id="btn-start" class="control-btn" title="Go to Start">⏮</button>
          <button id="btn-reverse" class="control-btn" title="Play Reverse">◀◀</button>
          <button id="btn-stop" class="control-btn" title="Stop">⏸</button>
          <button id="btn-play" class="control-btn" title="Play Forward">▶▶</button>
          <button id="btn-end" class="control-btn" title="Go to End">⏭</button>
        </div>
        <input type="range" id="time-slider" min="0" step="1" value="0">
        <div class="epoch-info">
          <span id="date-label">Loading…</span>
          <span id="distance-label"></span>
        </div>
      </div>
      
      <div class="control-group">
        <label for="speed-slider">Playback Speed</label>
        <input type="range" id="speed-slider" min="0" max="100" value="50" step="1">
        <div class="speed-info">
          <span id="speed-label">1 day/sec</span>
        </div>
      </div>
      
      <div class="control-group">
        <label for="scale">Scale (AU)</label>
        <input type="range" id="scale" min="1" max="30" value="10">
      </div>
    </section>
    <section class="canvas-container">
      <canvas id="space-canvas" width="900" height="900"></canvas>
      <aside class="legend" id="legend"></aside>
    </section>
  </main>
</body>
  <script src="./app-chebyshev.js"></script>
  <script src="./app.js"></script>
</html>
